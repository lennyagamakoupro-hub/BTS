<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Leçon — rendu générique</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&family=Anton&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000000; --bg-2:#0a0a0a; --card:#131313;
  --ink:#ffffff; --ink-2:rgba(255,255,255,.78); --ink-3:rgba(255,255,255,.55); --ink-4:rgba(255,255,255,.32);
  --red:#e50914; --gold:#d9a441; --gold-2:#f0c46b;
  --mod:#c95636;
  --mod-deep: color-mix(in srgb, var(--mod) 68%, black 30%);
  --mod-soft: color-mix(in srgb, var(--mod) 16%, transparent);
  --ease:cubic-bezier(.22,.61,.36,1);
  --ease-pop:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}

/* switcheur de test — n'existe que dans ce prototype, jamais dans le site réel */
.devswitch{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:70;display:flex;gap:6px;
  background:rgba(0,0,0,.9);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:6px;flex-wrap:wrap;max-width:92vw;justify-content:center}
.devswitch a{font-family:"IBM Plex Mono";font-size:11px;color:var(--ink-3);text-decoration:none;padding:6px 10px;border-radius:8px}
.devswitch a.on{background:var(--mod);color:#fff}

.topbar{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;align-items:center;gap:16px;
  padding:14px 20px;background:var(--bg);border-bottom:1px solid rgba(255,255,255,.07)}
.topbar-exit{flex-shrink:0;width:38px;height:38px;border-radius:12px;background:var(--card);
  box-shadow:0 3px 0 0 rgba(255,255,255,.14);border:none;display:flex;align-items:center;justify-content:center;
  color:var(--ink-2);text-decoration:none;transition:transform .12s var(--ease),box-shadow .12s var(--ease)}
.topbar-exit:hover{color:var(--ink)}
.topbar-exit:active{transform:translateY(3px) scale(.96);box-shadow:0 0 0 0 rgba(255,255,255,.14)}
.topbar-exit svg{width:16px;height:16px}
.progress-track{position:relative;flex:1;height:14px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden}
.progress-fill{position:absolute;top:0;left:0;bottom:0;width:0%;border-radius:999px;
  background:linear-gradient(90deg, var(--mod-deep), var(--mod));transition:width .45s var(--ease-pop)}
.progress-seg{position:absolute;top:0;bottom:0;width:3px;background:rgba(0,0,0,.4);z-index:2}
.topbar-mark{flex-shrink:0;font-family:"IBM Plex Mono";font-size:12px;font-weight:600;letter-spacing:.02em;
  color:var(--ink-3);white-space:nowrap;min-width:50px;text-align:right}

.doc-header{position:relative;padding:104px 24px 40px;max-width:820px;margin:0 auto}
.doc-id{font-family:"IBM Plex Mono";font-size:13px;letter-spacing:.03em;color:var(--mod);margin-bottom:16px;font-weight:600}
.doc-title{font-family:"Manrope";font-weight:800;font-size:clamp(34px,5.4vw,68px);line-height:1.04;margin:0}
.doc-dek{font-size:17px;font-weight:500;line-height:1.6;color:var(--ink-2);max-width:580px;margin:20px 0 0}
.doc-meta{margin-top:22px;font-family:"IBM Plex Mono";font-size:12px;letter-spacing:.02em;color:var(--ink-4)}

.lesson{position:relative;max-width:820px;margin:0 auto;padding:0 24px}

.chapter{position:relative;padding:60px 0 16px;border-top:1px solid rgba(255,255,255,.08)}
.chapter:first-of-type{padding-top:8px;border-top:none}
.chapnum{position:absolute;top:8px;left:-4px;font-family:"Anton";font-weight:400;
  font-size:clamp(72px,11vw,150px);line-height:1;color:transparent;
  -webkit-text-stroke:1px rgba(255,255,255,.08);z-index:0;user-select:none;pointer-events:none}
.chapter-inner{position:relative;z-index:1}
.chap-id{font-family:"IBM Plex Mono";font-size:12.5px;letter-spacing:.03em;color:var(--mod);margin-bottom:12px;font-weight:600}
.chap-title{font-family:"Manrope";font-weight:800;font-size:clamp(24px,3.4vw,36px);line-height:1.12;margin:0 0 12px}
.chap-lede{font-weight:600;font-size:17px;line-height:1.45;color:var(--ink-2);max-width:560px;margin:0 0 26px}

.item{background:var(--card);border-radius:18px;padding:24px 24px 26px;margin-bottom:16px;
  box-shadow:0 4px 0 0 var(--mod);border:1px solid rgba(255,255,255,.04);
  opacity:0;transform:translateY(18px) scale(.97);
  transition:opacity .45s var(--ease-pop),transform .45s var(--ease-pop)}
.item.in{opacity:1;transform:none}
.item-label{display:flex;align-items:center;gap:9px;font-family:"Manrope";font-weight:700;font-size:16px;
  color:var(--ink);margin-bottom:10px}
.item-label .dot{width:8px;height:8px;border-radius:50%;background:var(--mod);flex-shrink:0}
.item-body{font-size:15.5px;font-weight:500;line-height:1.6;color:var(--ink-2)}
.item-body b{color:var(--ink);font-weight:700}
.plain-list{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.plain-list li{font-size:15px;font-weight:500;line-height:1.55;color:var(--ink-2);padding-left:16px;position:relative}
.plain-list li::before{content:"";position:absolute;left:0;top:9px;width:5px;height:5px;border-radius:50%;background:var(--mod)}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:2px}
.stat-badge{border-radius:14px;padding:16px 15px;
  background:linear-gradient(160deg, var(--mod-soft), rgba(255,255,255,.02));
  box-shadow:0 3px 0 0 var(--mod-deep)}
.stat-badge .sv{display:block;font-family:"Manrope";font-weight:800;font-size:23px;color:var(--ink);letter-spacing:-.01em}
.stat-badge .sc{display:block;margin-top:5px;font-size:12.5px;font-weight:600;color:var(--ink-2);line-height:1.35}

.lesson-end{position:relative;max-width:820px;margin:0 auto;padding:60px 24px 140px;text-align:center}
.lesson-end p{color:var(--ink-2);font-size:15px;font-weight:600;margin:0 0 22px}
.btn-solid{display:inline-flex;align-items:center;gap:9px;padding:15px 28px;border-radius:16px;
  background:var(--mod);color:#fff;text-decoration:none;font-family:"Manrope";font-weight:800;font-size:14.5px;
  box-shadow:0 4px 0 0 var(--mod-deep);border:none;transition:transform .12s var(--ease),box-shadow .12s var(--ease)}
.btn-solid:active{transform:translateY(4px) scale(.99);box-shadow:0 0 0 0 var(--mod-deep)}
.btn-solid svg{width:15px;height:15px}

.empty{max-width:820px;margin:140px auto;padding:0 24px;color:var(--ink-3);font-size:15px}

@media (prefers-reduced-motion: reduce){
  .item{opacity:1!important;transform:none!important;transition:none!important}
  .progress-fill{transition:none!important}
}
</style>
</head>
<body>

<div class="topbar">
  <a class="topbar-exit" href="../index.html" aria-label="Quitter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
  <div class="progress-track" id="progressTrack"><div class="progress-fill" id="progressFill"></div></div>
  <div class="topbar-mark" id="topbarMark">—</div>
</div>

<header class="doc-header" id="docHeader"></header>
<main class="lesson" id="lesson"></main>
<footer class="lesson-end" id="lessonEnd" style="display:none">
  <p id="endLine"></p>
  <a class="btn-solid" href="../index.html">Retour au programme<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
</footer>

<nav class="devswitch" id="devswitch"></nav>

<!-- données réelles du site, même ordre de chargement que index.html -->
<script defer src="../data.js"></script>
<script defer src="../deep-dive-data.js"></script>
<script defer src="../lenny-droit-deepdive-1.js"></script>
<script defer src="../lenny-droit-deepdive-2.js"></script>
<script defer src="../lenny-syndic-deepdive.js"></script>
<script defer src="../lenny-acte-deepdive-1.js"></script>
<script defer src="../lenny-acte-deepdive-2.js"></script>

<script defer>
(function(){
  var NUM_RE = /^(\d+)\s*(%|an|ans|jours?|€)\b\s*(.*)$/;

  function ready(fn){
    if(document.readyState === 'complete') fn();
    else window.addEventListener('load', fn);
  }

  ready(function(){
    var params = new URLSearchParams(location.search);
    var testIds = ['m1','macte1','mdroit','syn','macte4'];
    var moduleId = params.get('module') || 'macte4';

    var switchNav = document.getElementById('devswitch');
    testIds.forEach(function(id){
      var a = document.createElement('a');
      a.href = '?module=' + id;
      a.textContent = id;
      if(id === moduleId) a.className = 'on';
      switchNav.appendChild(a);
    });

    var mod = (window.MODULES || []).find(function(m){ return m.id === moduleId; });
    var allDD = window.DEEPDIVE || {};
    var cards = Object.keys(allDD).map(function(k){ return allDD[k]; }).filter(function(d){ return d.mod === moduleId; });

    var docHeader = document.getElementById('docHeader');
    var lesson = document.getElementById('lesson');
    var lessonEnd = document.getElementById('lessonEnd');

    if(!mod){
      lesson.innerHTML = '<div class="empty">Module « ' + moduleId + ' » introuvable dans window.MODULES.</div>';
      return;
    }
    document.documentElement.style.setProperty('--mod', mod.color);

    docHeader.innerHTML =
      '<div class="doc-id">' + mod.tag + ' · ' + mod.short + '</div>' +
      '<h1 class="doc-title">' + mod.title + '</h1>' +
      '<p class="doc-dek" id="docDek"></p>' +
      '<div class="doc-meta" id="docMeta"></div>';

    if(cards.length === 0){
      lesson.innerHTML = '<div class="empty">Aucune fiche trouvée dans window.DEEPDIVE pour <code>mod === "' + moduleId + '"</code>. ' +
        'Ce module n’a peut-être pas (encore) de deep-dive, ou son contenu vit sous un autre identifiant — cas réel observé pour « mdroit » (les sous-thèmes mddeonto / mdjustice / mdsources / mdcontrats / mdfamille / mdpreuve ne portent pas mod:"mdroit").</div>';
      document.getElementById('docDek').textContent = '';
      document.getElementById('docMeta').textContent = '0 fiche';
      return;
    }

    document.getElementById('docDek').textContent = cards.length + (cards.length > 1 ? ' notions clés à traverser.' : ' notion clé à traverser.');

    var html = '';
    cards.forEach(function(card, i){
      var n = i + 1;
      var numStr = n < 10 ? '0' + n : '' + n;
      html += '<section class="chapter" data-index="' + i + '"><span class="chapnum">' + numStr + '</span>' +
        '<div class="chapter-inner">' +
        '<div class="chap-id">Fiche ' + numStr + ' / ' + cards.length + '</div>' +
        '<h2 class="chap-title">' + card.title + '</h2>' +
        (card.lede ? '<p class="chap-lede">' + card.lede + '</p>' : '') +
        '<div class="items">';

      (card.sections || []).forEach(function(sec){
        html += '<div class="item"><div class="item-label"><span class="dot"></span>' + (sec.h || '') + '</div>';
        if(sec.b){
          html += '<p class="item-body">' + sec.b + '</p>';
        }
        if(sec.list && sec.list.length){
          var parsed = sec.list.map(function(li){ return NUM_RE.exec(li); });
          var allNumeric = parsed.every(function(m){ return m; });
          if(allNumeric){
            html += '<div class="stat-grid">';
            parsed.forEach(function(m){
              html += '<div class="stat-badge"><span class="sv"><span class="num" data-target="' + m[1] + '">0</span> ' + m[2] + '</span>' +
                '<span class="sc">' + (m[3] || '') + '</span></div>';
            });
            html += '</div>';
          } else {
            html += '<ul class="plain-list">' + sec.list.map(function(li){ return '<li>' + li + '</li>'; }).join('') + '</ul>';
          }
        }
        html += '</div>';
      });

      html += '</div></div></section>';
    });
    lesson.innerHTML = html;

    lessonEnd.style.display = 'block';
    document.getElementById('endLine').textContent = 'Fin — ' + mod.title + ', ' + cards.length + (cards.length > 1 ? ' fiches traversées.' : ' fiche traversée.');

    // temps de lecture réel, sur le texte effectivement rendu
    var words = lesson.querySelectorAll('.item-body, .plain-list li, .chap-lede, .doc-dek');
    var count = 0;
    words.forEach(function(el){ count += el.textContent.trim().split(/\s+/).filter(Boolean).length; });
    var minutes = Math.max(1, Math.round(count / 200));
    document.getElementById('docMeta').textContent = cards.length + (cards.length > 1 ? ' fiches' : ' fiche') + ' · lecture ≈ ' + minutes + ' min';

    // barre de progression segmentée — s'adapte au nombre réel de fiches
    var track = document.getElementById('progressTrack');
    var fill = document.getElementById('progressFill');
    var mark = document.getElementById('topbarMark');
    var chapters = Array.prototype.slice.call(document.querySelectorAll('.chapter'));
    var segPcts = [];

    function layoutSegments(){
      var h = document.documentElement;
      var max = h.scrollHeight - h.clientHeight;
      track.querySelectorAll('.progress-seg').forEach(function(s){ s.remove(); });
      segPcts = chapters.map(function(ch){ return max > 0 ? (ch.offsetTop / max) * 100 : 0; });
      segPcts.slice(1).forEach(function(pct){
        var seg = document.createElement('div');
        seg.className = 'progress-seg';
        seg.style.left = pct + '%';
        track.appendChild(seg);
      });
    }
    var ticking = false;
    function updateProgress(){
      var h = document.documentElement;
      var max = h.scrollHeight - h.clientHeight;
      var pct = max > 0 ? (h.scrollTop / max) * 100 : 0;
      fill.style.width = pct + '%';
      var current = 1;
      segPcts.forEach(function(segPct, i){ if(pct >= segPct - 0.5) current = i + 1; });
      mark.textContent = current + '/' + chapters.length;
      ticking = false;
    }
    window.addEventListener('scroll', function(){
      if(!ticking){ window.requestAnimationFrame(updateProgress); ticking = true; }
    }, {passive:true});
    window.addEventListener('resize', function(){ layoutSegments(); updateProgress(); });
    layoutSegments();
    updateProgress();

    var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    var items = document.querySelectorAll('.item');
    if(reducedMotion){
      items.forEach(function(el){ el.classList.add('in'); });
    } else {
      var cardIO = new IntersectionObserver(function(entries){
        entries.forEach(function(entry){
          if(entry.isIntersecting){ entry.target.classList.add('in'); cardIO.unobserve(entry.target); }
        });
      }, {threshold:.15, rootMargin:'0px 0px -8% 0px'});
      items.forEach(function(el){ cardIO.observe(el); });
    }

    function countUp(numEl){
      var target = parseFloat(numEl.getAttribute('data-target'));
      if(reducedMotion || isNaN(target)){ numEl.textContent = target; return; }
      var duration = 700, start = null;
      function ease(t){ return 1 - Math.pow(1 - t, 3); }
      function step(ts){
        if(start === null) start = ts;
        var p = Math.min(1, (ts - start) / duration);
        numEl.textContent = Math.round(ease(p) * target);
        if(p < 1) window.requestAnimationFrame(step);
        else numEl.textContent = target;
      }
      window.requestAnimationFrame(step);
    }
    var numIO = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting){ countUp(entry.target); numIO.unobserve(entry.target); }
      });
    }, {threshold:.4});
    document.querySelectorAll('.num').forEach(function(el){ numIO.observe(el); });
  });
})();
</script>
</body>
</html>
